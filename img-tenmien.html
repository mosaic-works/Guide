<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tenmien — Dữ liệu ảnh</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .img-detail-page { background: var(--paper); min-height: 100vh; display: flex; flex-direction: column; }
        .img-detail-main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 24px; }
        .img-detail-label { display: inline-block; margin-bottom: 18px; padding: 4px 12px; border-radius: 999px; background: var(--sand); color: var(--clay-dark); font-size: .76rem; font-weight: 750; letter-spacing: .05em; text-transform: uppercase; }
        .img-detail-title { margin: 0 0 40px; font-family: var(--serif); font-size: clamp(2rem, 4vw, 3rem); font-weight: 500; letter-spacing: -.03em; text-align: center; }
        .img-detail-frame { width: 100%; max-width: 900px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); overflow: hidden; box-shadow: 0 8px 40px rgba(0,0,0,.07); }
        .img-detail-frame img { display: block; width: 100%; height: auto; }
        .img-detail-caption { padding: 18px 24px; border-top: 1px solid var(--line); color: var(--muted); font-size: .9rem; font-style: italic; text-align: center; }
        .img-back { display: inline-flex; align-items: center; gap: 8px; margin-top: 36px; color: var(--clay-dark); font-size: .92rem; font-weight: 700; text-decoration: none; }
        .img-back:hover { color: var(--ink); }
        .img-back::before { content: '←'; }
    </style>
</head>
<body class="img-detail-page">

    <header class="site-header">
        <div class="shell header-inner">
            <a class="brand" href="index.html" aria-label="Awareness">
                <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2v28M2 16h28M6.1 6.1l19.8 19.8M25.9 6.1 6.1 25.9M10.6 3.5l10.8 25M28.5 10.6l-25 10.8M21.4 3.5l-10.8 25M3.5 10.6l25 10.8"/></svg>
                <span>Awareness</span>
            </a>

        </div>
    </header>

    <main class="img-detail-main">
        <span class="img-detail-label">Dữ liệu ảnh · 04</span>
        <h1 class="img-detail-title">Tenmien</h1>
        <div class="img-detail-frame">
            <img src="img/tenmien.png" alt="Cấu hình tên miền">
            <p class="img-detail-caption">Minh họa cấu hình tên miền — địa chỉ giúp người dùng truy cập website dễ dàng.</p>
        </div>

    </main>

</body>
</html>
